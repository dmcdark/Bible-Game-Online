services:
  game:
    image: ${GAME_IMAGE:?Set GAME_IMAGE to a published channel tag or version in .env}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env first}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 384m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    volumes:
      - game-data:/app/.data
    networks:
      - game-only
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  game-data:

networks:
  game-only:

# Install in /etc/nginx/conf.d/bible-game-common.conf, inside http {}.
# REALITY may hide the real IP: these are SITE-WIDE limits, not per-player.
map $http_upgrade $bible_game_connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $server_name zone=bible_game_http:1m rate=60r/s;
limit_req_zone $server_name zone=bible_game_socket:1m rate=20r/s;
limit_conn_zone $server_name zone=bible_game_connections:1m;

log_format bible_game_json escape=json
    '{"time":"$time_iso8601","peer":"$remote_addr","host":"$host",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"seconds":$request_time}';
